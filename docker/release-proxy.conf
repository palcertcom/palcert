# The single published surface of the release stack.
#
# Vendor-neutral on purpose: nginx here stands in for whatever terminates TLS
# in a real deployment — a cloud load balancer, an ingress controller, a CDN.
# What matters for release testing is the shape, not the product: one entry
# point, everything else unreachable from outside.
#
# TLS is terminated here, with the stack's own private CA. Not decoration:
# PalCert's production configuration refuses to boot unless the public web URL
# is https, and a release stack that disabled that check would be testing a
# different system from the one that ships.

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /certs/proxy.crt;
    ssl_certificate_key /certs/proxy.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Forwarding headers are *overwritten*, never extended (Phase 20
    # Checkpoint 7).
    #
    # PalCert authenticates and authorizes every request itself, so the proxy
    # is not trusted for an identity. It is trusted for one thing: saying which
    # address a request came from. Two security decisions read it — the per-IP
    # login throttle and the per-IP public-verification guard — and every audit
    # record stores it.
    #
    # `$proxy_add_x_forwarded_for` *appends* to whatever the client sent, so a
    # request arriving with a made-up X-Forwarded-For produced a two-entry list
    # with the attacker's value first. Reading the last entry happened to be
    # correct, which made the whole thing depend on a subtlety nobody should
    # have to re-derive. `$remote_addr` replaces the list with the one address
    # this proxy actually observed, so there is nothing to get subtly right.
    #
    # X-Forwarded-Host and the RFC 7239 `Forwarded` header are set here for the
    # same reason: unset, they pass through from the client untouched, and an
    # empty value is how nginx removes a header.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Forwarded "";

    # Uploads are documents, not form posts.
    client_max_body_size 64m;

    # The API, under the same origin as the web app so the browser never makes
    # a cross-origin request and the session cookie stays first-party.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_read_timeout 120s;
    }

    # The API's own probes, kept reachable for smoke testing. `/health/` on
    # this proxy is the API's, because the web app's liveness is answered by
    # the container's own HEALTHCHECK and nothing outside needs it.
    location /health/ {
        proxy_pass http://api:4000;
        access_log off;
    }

    # Telemetry is internal (Phase 20 Checkpoint 3). Every service exposes a
    # `/metrics` endpoint on the deployment network, where a scraper reaches
    # it directly; nothing outside may read one. Without this, the catch-all
    # below would proxy an external `/metrics` straight to the web app.
    #
    # 404 rather than 403, and `^~` so it also covers `/metrics/anything`:
    # the outside should not be able to tell that the endpoint exists at all.
    location ^~ /metrics {
        return 404;
        access_log off;
    }

    # Presigned uploads and downloads (Phase 20 Checkpoint 9).
    #
    # A browser moves document bytes straight to and from object storage with
    # a presigned URL; the API never carries them. The web app's Content
    # Security Policy lets the browser connect to its own origin and nothing
    # else (Checkpoint 20.7), so those URLs are signed for this origin
    # (`STORAGE_PUBLIC_ENDPOINT` = `APP_PUBLIC_WEB_URL`, enforced at boot) and
    # this location carries the bucket paths on to MinIO. Before it existed,
    # every upload through the UI died in the browser with a CSP violation
    # against an unpublished `https://localhost:9000`.
    #
    # The route is narrow on purpose:
    #
    # - only the three bucket paths, and only an object path inside one: a
    #   bare `/palcert-documents/` (a bucket listing) falls through to the web
    #   app and is a 404;
    # - only GET/HEAD and PUT, the two operations a presigned URL here ever
    #   authorizes;
    # - `Authorization` and `Cookie` are removed, so the public route serves
    #   presigned requests and nothing else: a request signed with a storage
    #   credential in a header, or one that rides the session cookie, gets no
    #   further than an unsigned one;
    # - every response is sandboxed and never sniffed. A document is served
    #   from the web app's own origin now, so it must not be able to run as
    #   that origin, whatever its bytes are.
    location ~ ^/(palcert-documents|palcert-quarantine|palcert-derived)/.+ {
        limit_except GET PUT {
            deny all;
        }

        proxy_pass https://minio:9000;
        proxy_http_version 1.1;

        # SigV4 signs the host *with* its port, so the header MinIO sees must
        # be the one the browser sent. `$host` drops the port and every
        # signature fails.
        #
        # `proxy_set_header` in a location replaces the server-level list
        # rather than adding to it, so the forwarding headers are restated.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";

        # MinIO's certificate is issued by the stack's CA and names `minio`.
        proxy_ssl_trusted_certificate /certs/ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_name minio;
        proxy_ssl_server_name on;

        # The largest document PalCert accepts (UPLOAD_MAX_PDF_BYTES, 200 MiB
        # by default), streamed through rather than spooled to disk first.
        # An operator who raises the upload limit raises this with it.
        client_max_body_size 200m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Replaced rather than added to: MinIO sends its own, and two copies
        # of a header are two policies for a browser to reconcile.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        # Not logged: every URL here carries a live signature in its query
        # string, and an access log is not a place for bearer credentials.
        access_log off;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_read_timeout 60s;
    }
}
